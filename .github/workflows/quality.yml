name: Quality

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      COREPACK_HOME: ${{ github.workspace }}/.tools/corepack
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PNPM_CONFIG_NPMRC_AUTH_FILE: ${{ github.workspace }}/.config/pnpm-auth-empty
      PNPM_HOME: ${{ github.workspace }}/.tools/pnpm
      TMPDIR: ${{ github.workspace }}/.tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      XDG_CONFIG_HOME: ${{ github.workspace }}/.config
      XDG_DATA_HOME: ${{ github.workspace }}/.local/share
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install and run quality gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$COREPACK_HOME" "$PLAYWRIGHT_BROWSERS_PATH" "$PNPM_HOME" "$TMPDIR" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          : > "$PNPM_CONFIG_NPMRC_AUTH_FILE"
          export PATH="$PNPM_HOME:$PATH"
          corepack enable --install-directory "$PNPM_HOME"
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm check
